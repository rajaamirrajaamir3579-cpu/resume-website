<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Resume Builder USA - Build Professional Resume Free</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4f8;margin:0;padding:15px}
.container{max-width:600px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1)}
h1{text-align:center;color:#0d47a1}
input,textarea{width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:16px;background:#1565c0;color:white;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}
button:hover{background:#0d47a1}
.ad-box{background:#fff8e1;border:2px dashed #ff9800;padding:15px;text-align:center;margin:15px 0;border-radius:8px;color:#e65100;font-weight:bold}
#output{display:none;margin-top:20px;border:2px solid #1565c0;padding:20px;border-radius:10px;background:#fafafa}
</style>
</head>
<body>
<div class="container">
<h1>🇺🇸 FREE Resume Builder</h1>
<p style="text-align:center;color:green;font-weight:bold">100% FREE - USA Format - No Signup</p>

<div class="ad-box">Advertisement - Your Earning Area</div>

<input id="name" placeholder="Full Name">
<input id="title" placeholder="Job Title (e.g. Customer Service)">
<input id="phone" placeholder="Phone Number">
<input id="email" placeholder="Email">
<input id="edu" placeholder="Education (e.g. High School Diploma)">
<textarea id="exp" rows="4" placeholder="Work Experience"></textarea>
<textarea id="skills" rows="3" placeholder="Skills (e.g. Communication, MS Office)"></textarea>

<button onclick="generate()">Generate Professional Resume FREE</button>

<div class="ad-box">Advertisement - Your Earning Area</div>

<div id="output"></div>
</div>

<script>
function generate(){
let n=document.getElementById('name').value;
let t=document.getElementById('title').value;
let p=document.getElementById('phone').value;
let em=document.getElementById('email').value;
let ed=document.getElementById('edu').value;
let ex=document.getElementById('exp').value;
let sk=document.getElementById('skills').value;
if(!n){alert('Please Enter Name');return}
let out=document.getElementById('output');
out.style.display='block';
out.innerHTML=`
<h2 style="margin:0;color:#0d47a1">${n}</h2>
<p><b>${t}</b> | ${p} | ${em}</p>
<hr>
<h3>Education</h3><p>${ed}</p>
<h3>Experience</h3><p>${ex}</p>
<h3>Skills</h3><p>${sk}</p>
<hr>
<p style="color:green;font-weight:bold">✓ ATS Friendly - US Format</p>
<button onclick="window.print()" style="background:green">Print / Save as PDF</button>
<div class="ad-box" style="margin-top:15px">Advertisement</div>
`;
window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
  </html>
